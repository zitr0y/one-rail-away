# Target is the already-registered canonical id: the UIC id where one side has
# one, else the first-registered feed's fresh id ("x:<feed>:<stop_id>").
"oebb:de:08111:6115:1:1" = "x:db_fern:627018"      # Stuttgart Hbf (unparented oebb platform)
"oebb:de:08111:6115:5:10" = "x:db_fern:627018"     # Stuttgart Hbf (unparented oebb platform)
