# Manual cross-feed station merge overrides.
#
# Each entry forces one feed-local stop to a chosen canonical station id, taking
# precedence over UIC-regex extraction and proximity matching. Use this when the
# validation step reports either a missed merge (two ids that are the same physical
# station) or a wrong merge that automatic rules cannot resolve.
#
# Since 2026-07-10 (backlog G, merge.py rule #7) an unknown UIC code falls back
# to the same proximity+name check as other stops before minting itself as
# canonical, so most same-name UIC-vs-non-UIC collisions below would now merge
# automatically. The entries are KEPT deliberately: removing one would re-key
# its canonical id (first-registered id wins), silently regressing anything
# keyed by the old id (station_countries.toml overrides -- Konstanz precedent).
# Cross-language name twins ("Sarrebruck" vs "Saarbruecken Hbf") still need
# aliases -- the fallback requires normalized-name equality.
#
# Format:  "<feed>:<stop_id>" = "<canonical UIC id>"
# Example: "borderia:bs-3333333" = "3333333"
[aliases]

# CP's national GTFS is registered before Renfe so Portugal owns its stations.
# Renfe's TRENCELTA cross-border trip describes these Portuguese termini with
# bilingual/diacritic variants that cannot normalize-match CP's names; the
# 2026-07-14 CP+Renfe targeted build measured the pairs at 55m and 28m.
"renfe:94346" = "x:cp:94_2006"                  # Porto Campanha - O Porto Campaña -> Porto Campanha
"renfe:22402" = "x:cp:94_7005"                  # Valença do Minho -> Valenca

# Real-run merge fixes (first full build, 2026-07): db_fern uses internal stop
# ids and sncf StopArea ids carry the 8-digit code with check digit, so these
# border stations cannot UIC-merge with the 7-digit ids that oebb/sbb register
# directly (and proximity never fires for a UIC-registered id). Force them
# onto the UIC canonical id that validation reported.
"db_fern:527240" = "5433425"              # Breclav (oebb)
"db_fern:326611" = "8102336"              # Bregenz (oebb)
"db_fern:329971" = "8814001"              # Bruxelles Midi (oebb NJ)
"db_fern:306040" = "8301307"              # Como S. Giovanni (oebb/sbb)
"db_fern:557701" = "5457256"              # Praha-Holesovice (oebb)
"sncf:StopArea:OCE87182063" = "8718206"   # Mulhouse (sbb)
"sncf:StopArea:OCE87715136" = "8771513"   # Frasne (sbb)
# THURBO IR75 (Zürich-Konstanz), newly admitted by the Swiss-operators route filter
# 2026-07-10, registers Konstanz as UIC 8014586; proximity never fires for
# UIC-registered ids (same pattern as Mulhouse/Frasne above).
"db_fern:185018" = "8014586"              # Konstanz (sbb IR75)

# oebb carries a handful of Austrian stops BOTH as a 7-digit-UIC-id stop and
# as an unparented platform stop; the UIC one registers first, so proximity
# never fires for the platform twin.
"oebb:at:48:585:0:3" = "8102329"          # Dornbirn
"oebb:at:48:817:0:4" = "8101236"          # Feldkirch

# db_fern's Singen resolves to child name "Singen(Hohentwiel)", norm-equal to
# sbb's UIC-registered 8014558 twin.
"db_fern:41818" = "8014558"               # Singen (Hohentwiel) (sbb)

