<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 30 156 60">
  <!-- Header train — the train portion of design/logo/onestopeurope-lockup-A1.svg,
       lifted VERBATIM (identical coordinates) so the header mark matches the
       Inkscape source exactly. White strokes for the navy bar. The rail (line)
       exits right and is continued under the wordmark by CSS (.header-brand::after).
       Do not hand-transcribe — re-export from the lockup if the source changes. -->
  <!-- Rail (belly line) -->
  <line x1="-0.27119094" y1="80.491112" x2="473.58664" y2="80.491112"
        fill="none" stroke="#ffffff" stroke-width="2.93228" stroke-linecap="round"/>
  <!-- Car body (belly on the rail at y=80) -->
  <path d="M38 80 V46 Q38 36 48 36 H118 Q136 36 146 50 L156 68 Q160 76 152 80 Z"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <!-- Wheels (hollow dots on the rail) -->
  <circle cx="65.355804" cy="79.874046" r="4" fill="#003399" stroke="#ffffff" stroke-width="3"/>
  <circle cx="119.73622" cy="79.887115" r="4" fill="#003399" stroke="#ffffff" stroke-width="3"/>
  <!-- Dot eyes -->
  <circle cx="122" cy="52" r="2.4" fill="#ffffff"/>
  <circle cx="136" cy="56" r="2.4" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M124 62 Q130 66 135 61" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Dotted window line -->
  <path d="M48 46 H100" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="1 7" stroke-linecap="round"/>
  <!-- Gold star -->
  <text x="84.424316" y="70" font-size="16" fill="#ffcc00">★</text>
</svg>
