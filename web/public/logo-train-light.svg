<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 30 156 60">
  <!-- Header train (white-stroke, for the navy bar). viewBox hugs the train so it
       renders large at header height; the rail (y=80) exits right and is continued
       under the wordmark by CSS (.header-brand::after). -->
  <!-- Left rail stub + station dot -->
  <path d="M4 80 H38" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="14" cy="80" r="4" fill="#003399" stroke="#ffffff" stroke-width="3"/>
  <!-- Train body -->
  <path d="M38 80 V46 Q38 36 48 36 H118 Q136 36 146 50 L156 68 Q160 76 152 80 Z" stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <!-- Wheels -->
  <circle cx="58" cy="80" r="7" stroke="#ffffff" stroke-width="3" fill="#003399"/>
  <circle cx="126" cy="80" r="7" stroke="#ffffff" stroke-width="3" fill="#003399"/>
  <!-- Dot eyes -->
  <circle cx="122" cy="52" r="2.4" fill="#ffffff"/>
  <circle cx="136" cy="56" r="2.4" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M124 62 Q130 66 135 61" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Dotted window line -->
  <path d="M48 46 H100" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="1 7" stroke-linecap="round"/>
  <!-- Gold star -->
  <text x="66" y="70" font-size="16" fill="#ffcc00">★</text>
</svg>
