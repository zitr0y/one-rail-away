# Capital cities: ISO 2-letter country code → exact canonical station name.
# Matched by exact name AND country during `ose compute`; an entry that matches
# no station logs a warning and is skipped (never fails the build).
# Edit taste here — the pipeline just flags `is_capital: true`.
[capitals]
DE = "Berlin Hbf"
FR = "Paris Gare du Nord"
AT = "Wien Hbf"
NL = "Amsterdam Centraal"
ES = "Madrid-Puerta de Atocha-Almudena Grandes"
PL = "Warszawa Centralna"
CH = "Bern"
BE = "Bruxelles Midi"
CZ = "Praha hl.n."
# Cross-border "leak" capitals — in the data only via foreign feeds (user
# report 2026-07-11: London/Roma had no star). Names exactly as leaked.
# Vilnius/København/Lisboa/Stockholm/Oslo are in NO ingested feed yet
# (backlog item A); add them here when their feeds land.
GB = "London St. Pancras Int."
UA = "Kyjiw-Passaschyrskyj"
RO = "București Nord Gara A"
IT = "Roma, Stazione di Roma Tiburtina"
LU = "Luxembourg"
SI = "Ljubljana"
HU = "Budapest-Keleti"
HR = "Zagreb Glavni kolodvor"
SK = "Bratislava hl.st."
