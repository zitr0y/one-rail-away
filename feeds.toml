[feeds.db_fern]
url = "https://download.gtfs.de/germany/fv_free/latest.zip"
country = "DE"
license = "CC BY 4.0 - verify commercial terms before monetizing (fallback: DELFI NAP)"
route_allow = ["^ICE?\\b", "^ECE?\\b", "^NJ\\b", "^RJX?\\b", "^FLX\\b", "^TGV\\b", "^EST\\b"]
uic_regex = "(\\d{7})"

[feeds.sncf]
url = "https://eu.ftp.opendatasoft.com/sncf/gtfs/export_gtfs_voyages.zip"
country = "FR"
license = "ODbL (transport.data.gouv.fr)"
# route_long_name carries the brand as a trailing word (e.g. "Lille - Alpes TGV"),
# not a leading one -- unanchored \b match, verified against the real 2026-07 export
# (this feed only contains TGV-branded lines; INTERCIT/OUIGO/EUROSTAR/LYRIA never
# appear in route_long_name here, so those patterns are kept for forward-compat).
route_allow = ["\\bTGV\\b", "\\bINTERCIT", "\\bOUIGO", "\\bEUROSTAR", "\\bICE\\b", "\\bLYRIA"]
uic_regex = "87(\\d{5})$"

[feeds.oebb]
url = "https://static.web.oebb.at/open-data/soll-fahrplan-gtfs/GTFS_Fahrplan_2026.zip"
country = "AT"
license = "CC BY 4.0"
route_allow = ["^RJX?\\b", "^ICE?\\b", "^ECE?\\b", "^NJ\\b", "^D\\b"]
uic_regex = "(\\d{7})"

[feeds.sbb]
url = "https://data.opentransportdata.swiss/dataset/timetable-2026-gtfs2020/permalink"
country = "CH"
license = "Open data (opentransportdata.swiss)"
route_allow = ["^ICE?\\b", "^ECE?\\b", "^TGV", "^RJX?\\b", "^NJ\\b", "^IR\\b"]
uic_regex = "(\\d{7})"

[feeds.ns]
url = "https://gtfs.ovapi.nl/nl/gtfs-nl.zip"
country = "NL"
license = "CC0 (ovapi)"
route_allow = ["^Intercity", "^ICE?\\b", "^Eurostar", "^Nightjet"]
# No uic_regex: ovapi's stop_id is a per-platform internal id (e.g. dozens of
# distinct 7-digit ids for "Amsterdam Centraal", one per track/stopover), not a
# UIC station code -- it only happens to be 7 digits, which made the UIC-regex
# extraction register each platform as its own "station" (verified against the
# real 2026-07 export: caused ~900 unmerged-duplicate validation failures).
# Omitting uic_regex here falls back to proximity+name matching, which
# correctly collapses same-named stops within 500m into one station.
