[feeds.db_fern]
url = "https://download.gtfs.de/germany/fv_free/latest.zip"
country = "DE"
license = "CC BY 4.0 - verify commercial terms before monetizing (fallback: DELFI NAP)"
route_allow = ["^ICE?\\b", "^ECE?\\b", "^NJ\\b", "^RJX?\\b", "^TGV\\b", "^EST\\b"]
uic_regex = "(\\d{7})"

[feeds.sncf]
# The old opendatasoft FTP export (eu.ftp.opendatasoft.com/sncf/gtfs/
# export_gtfs_voyages.zip) is STALE: as of 2026-07-07 it still serves a file whose
# calendar_dates cover only 2025-01-22..2025-02-21, so every sample date resolves
# to 0 trips. This is the current "Réseau SNCF TGV, Intercités et TER" GTFS from
# transport.data.gouv.fr (stable resource permalink, updated ~daily; checked
# 2026-07-07: covers 2026-07-07..2026-12-31).
url = "https://www.data.gouv.fr/api/1/datasets/r/9ae758ec-cd7a-40cd-a890-bb3963224942"
country = "FR"
license = "ODbL (transport.data.gouv.fr)"
# The combined export carries no brand in route or trip fields: route_short_name is
# an opaque line code ("003C", or "INCONNU"), and OUIGO/Lyria/Intercites long_names
# are plain city pairs ("Paris - Lyon") indistinguishable from TER. The commercial
# brand lives ONLY in the per-brand StopPoint ids ("StopPoint:OCETGV INOUI-87686006"
# vs "StopPoint:OCETrain TER-...`), so route_allow passes every route and
# stop_id_brand selects trips by brand (and labels them). Brands verified in the real
# 2026-07 export (trips): TGV INOUI 8864, INTERCITES 873, OUIGO 625, Lyria 341, ICE 243,
# INTERCITES de nuit 248, Train 117 (the Paris-Bruxelles rail corridor). Excluded:
# Train TER, Car TER, Car a reservation (road coaches), TramTrain, Navette.
route_allow = ["."]
# No uic_regex: this export's stop ids end in the 8-digit UIC code WITH check digit
# ("...-87686006"), while sbb/oebb carry 7-digit codes without it -- the values can
# never merge, and merge.py's digit-adjacency guard rejects any 7-of-8 partial
# capture anyway. Proximity+name matching (plus station_aliases.toml) handles
# cross-feed merges for SNCF stations.
# stop_id_brand doubles as the stop-id trip filter (same semantics as the old
# stop_id_allow list) and relabels each kept trip "<brand> <trip_headsign>".
# trip_headsign is 100% populated and numeric in this export (all 50,977 trips,
# verified 2026-07-09); route_short_name stays an opaque line code ("802A").
# Brand words are the official sub-brands (user decision 2026-07-10).
# "OCETrain-" is the classic-line Paris-Bruxelles corridor (via Aulnoye-Aymeries,
# train numbers 50-69, verified in the 2026-07 export): labeled "IC".
# "Train TER"/"Car TER" cannot match: every pattern requires "-" right after the
# brand, TER ids have " TER" there.
[feeds.sncf.stop_id_brand]
"^StopPoint:OCETGV INOUI-" = "TGV INOUI"
"^StopPoint:OCEOUIGO-" = "OUIGO"
"^StopPoint:OCEICE-" = "ICE"
"^StopPoint:OCELyria-" = "TGV Lyria"
"^StopPoint:OCEINTERCITES-" = "Intercités"
"^StopPoint:OCEINTERCITES de nuit-" = "Intercités de nuit"
"^StopPoint:OCETrain-" = "IC"

[feeds.oebb]
url = "https://static.web.oebb.at/open-data/soll-fahrplan-gtfs/GTFS_Fahrplan_2026.zip"
country = "AT"
license = "CC BY 4.0"
# OEBB route names are corridor codes carrying no train category ("A10-1"), so no
# routes.txt pattern can select long-distance trips. route_allow lets every route
# through (all route_short_names are non-empty in the real 2026 export) and
# trip_allow does the real filtering against trips.txt trip_short_name ("RJ 658",
# "ICE 24", ...), which also becomes the train label. Categories verified present
# in the real export: RJX, RJ, ICE, EC, IC, EN, NJ, D (regional S/REX/R/CJX/IR/CAT
# excluded). "^EN\b" and "^NJ\b" are both nightjet-family; "^D\b" is D-Zug.
route_allow = ["."]
trip_allow = ["^RJX?\\b", "^ICE?\\b", "^ECE?\\b", "^NJ\\b", "^EN\\b", "^D\\b"]
uic_regex = "(\\d{7})"

[feeds.sbb]
url = "https://data.opentransportdata.swiss/dataset/timetable-2026-gtfs2020/permalink"
country = "CH"
license = "Open data (opentransportdata.swiss)"
# SBB brands domestic lines spaceless (IC1, IC51, IR16 -- 2026 GTFS routes.txt); "^IC\b"
# cannot match a letter->digit boundary, which silently dropped most Swiss domestic
# IC/IR service; user-reported 2026-07-09. The unanchored "^IC\d" form also matched
# foreign routes carried in the Swiss feed (French Intercites "IC190A", agency 87_LEX),
# whose bare-UIC stops duplicated SNCF stations; "\d{1,2}$" matches only Swiss
# operators' line numbers (verified against 2026 routes.txt+agency.txt: agencies
# 11/33/65/72/82 only).
route_allow = [
  "^ICE?\\b", "^ECE?\\b", "^TGV", "^RJX?\\b", "^NJ\\b", "^IR\\b",
  "^ICE?\\d{1,2}$", "^IR\\d{1,2}$",
]
uic_regex = "(\\d{7})"

[feeds.ns]
url = "https://gtfs.ovapi.nl/nl/gtfs-nl.zip"
country = "NL"
license = "CC0 (ovapi)"
route_allow = ["^Intercity", "^ICE?\\b", "^Eurostar", "^Nightjet"]
# No uic_regex: ovapi's stop_id is a per-platform internal id (e.g. dozens of
# distinct 7-digit ids for "Amsterdam Centraal", one per track/stopover), not a
# UIC station code -- it only happens to be 7 digits, which made the UIC-regex
# extraction register each platform as its own "station" (verified against the
# real 2026-07 export: caused ~900 unmerged-duplicate validation failures).
# Omitting uic_regex here falls back to proximity+name matching, which
# correctly collapses same-named stops within 500m into one station.

[feeds.rejseplanen]
url = "https://www.rejseplanen.info/labs/GTFS.zip"
country = "DK"
license = "Rejseplanen open data (rejseplanen.info/labs) - VERIFY reuse terms before monetizing"
# Official Rejseplanen all-modes GTFS, directly downloadable without registration.
# Live archive inspected 2026-07-13: 59,233,966 bytes (Last-Modified 2026-07-13),
# 26 agencies, 1,614 route rows and 36,366 stops. Its 1,595 calendar services and
# 16,441 exceptions cover 2026-07-13..2026-10-07 (including sample 2026-07-14).
# All stops have location_type=0 and no parent_station (12-digit zero-padded stop
# ids); names retain Danish diacritics. It also carries DE (30), SE (49), AT (7),
# and GL (50) stops, so this entry follows db_fern/oebb and cannot own those names.
# DSB route_type=2 products (route rows): IC/ICL/ECE/RJ/RE = 1/1/1/1/2. Keep those
# national intercity, EuroCity and regional services; exclude all other rail
# operators plus bus (3/700/715), S-tog (109), metro/light rail (0/1), and ferry
# (4). On 2026-07-14 this yields 882 trips: RE 485, IC 260, ICL 127, ECE 10,
# RJ 0. The public Labs page did not expose explicit reuse terms when checked;
# retain Rejseplanen attribution and verify commercial reuse before monetizing.
route_allow = ["^IC$", "^ICL$", "^ECE$", "^RJ$", "^RE$"]
# No uic_regex: stop ids are 12-digit zero-padded (Kobenhavn H = 000008600626);
# leading zeros defeat (\d{7}) extraction. Proximity+name merge (like ns/renfe/pkp)
# collapses the 8 Jylland stops that already leak from db_fern (EC toward Hamburg).

[feeds.flix]
url = "http://gtfs.gis.flix.tech/gtfs_generic_eu.zip"
country = "DE"
license = "ODbL 1.0 (Flix open data / transport.data.gouv.fr)"
# Flix generic EU feed carries FlixTrain (route_type=2, route_short_name
# "FlixTrain FLX10/20/30") and FlixBus (route_type=3, coach). ^FlixTrain selects
# only the 3 rail routes (218 trips); FlixBus is intentionally excluded (a separate
# "allow buses" overlay is a later feature). db_fern's ^FLX pattern is removed so
# flix is the single FlixTrain source (db_fern yields 0 FLX trips as of 2026-07-13;
# two sources would risk double-counting via through.py).
route_allow = ["^FlixTrain "]
# No uic_regex: UUID stop ids. FlixTrain names German stops "X Central Station
# (FlixTrain)" which never _norm-matches db's "X Hbf"; station_aliases.toml forces
# each onto its db_fern canonical (id->id).

[feeds.cp]
# Official CP GTFS: direct, registration-free download. HEAD checked 2026-07-14:
# 305,016 bytes, Last-Modified 2026-07-13. The Portuguese National Access Point
# metadata record 176 names CP as publisher and declares "No licence – No contract";
# retain the CP attribution and re-check that record if reuse terms change.
#
# Live archive inspected 2026-07-14: one agency (1094_CP, CP - Comboios de
# Portugal), 454 all-platform stops with internal `94_<code>` ids (not UIC), no
# parent_station hierarchy, proper Portuguese coordinates but ASCII-only names.
# Its calendar.txt/calendar_dates.txt covers 2025-12-14..2026-12-12. This is a
# rolling weekly publication: build.py tests every feed's validity window per
# probe, so probes outside a later CP archive's horizon are skipped rather than
# counted as zero service. All 454 stops lie in Portugal (no foreign stops).
#
# route rows (2026-07-14): 6 AP, 24 IC, 26 IR, 72 R, 3 U, and 47 urban-line
# names. Keep CP's national/interregional rail products AP/IC/IR/R; exclude U
# and the named Lisbon/Porto suburban routes. CP precedes Renfe so Portugal's
# own feed owns its stations where Renfe's cross-border Celta service overlaps.
url = "https://publico.cp.pt/gtfs/gtfs.zip"
country = "PT"
license = "No licence – No contract (Portuguese NAP record 176; attribution: CP - Comboios de Portugal)"
route_allow = ["^AP$", "^IC$", "^IR$", "^R$"]
# No uic_regex: `94_1008` / `71_37606` are CP internal stop ids, not UIC codes.

[feeds.trenitalia]
# Official Italian National Access Point, direct and registration-free. Its asset
# 1080596 is Trenitalia's validated NeTEx L1 gz:xml timetable. Checked 2026-07-14:
# 13 MB; publication timestamp 2026-07-09; UIC operating periods cover
# 2026-06-13..2026-12-12. NAP metadata says "No licence – No contract"; retain
# attribution to Trenitalia and re-check reuse terms before monetizing.
#
# The live feed: one Trenitalia operator; 1,948 StopPlaces, mostly all-caps names;
# 21 foreign stops (DE 6, AT 4, FR 10, plus one malformed Napoli coordinate). It
# follows DB/OEBB/SNCF so it cannot own foreign canonical station names. Pattern
# rows: REG 13,350, RV 1,807, FR 1,505, IC 701, ICN 533, EC 237, FB 55, FA 48,
# EN 32, EXP 12; excluded BUS 6,564, SFM 598, MET 502, regional REG/RV and FL bus.
url = "https://www.cciss.it/nap/mmtis/public/api/v1/download/blob/Asset/1080596/checkedResource"
country = "IT"
license = "No licence – No contract (Italian NAP asset 1080596; attribution: Trenitalia)"
format = "netex"
route_allow = ["^FR$", "^FA$", "^FB$", "^EC$", "^IC$", "^ICN$", "^EN$", "^EXP$"]
# NeTEx ScheduledStopPoint ids carry Trenitalia's internal 9-digit station code, not UIC.

[feeds.renfe]
# Renfe long-distance GTFS (registration-free), inspected 2026-07-10.
# https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip (776 KB).
# Single agency: 1071 RENFE OPERADORA. Calendar: 2026-07-10..2026-12-08.
# 1017 stops, 5-digit internal stop ids (NOT UIC — no uic_regex).
# parent_station hierarchy present; names carry proper Spanish diacritics.
# Route products by route_short_name (routes.txt row counts, 2026-07-10):
#   136 MD, 110 REG.EXP., 102 REGIONAL, 77 AVE, 73 ALVIA, 51 Intercity,
#   40 PROXIMDAD, 30 AVANT, 24 AVLO, 10 AVE INT, 7 EUROMED, 3 TRENCELTA,
#   2 AVANT EXP
# Excluded (medium-distance/commuter): AVANT, AVANT EXP, MD, REGIONAL,
# REG.EXP., PROXIMDAD.
# TRENCELTA (Vigo–Porto cross-border, ~2.5 h) IN by user decision — puts Porto
# on the map.
# License: Spanish public-sector reuse (Ley 37/2007 / RD 1495/2011,
# data.renfe.com/legal) — reuse allowed with attribution "Renfe".
# Position: LAST — name-ownership priority: renfe must not register first for
# the 7 French stops it carries (that would re-key SNCF canonicals).
# Quirk (2026-07-10, Task 3a): export pads every line (headers too) to fixed
# ~350-byte width with trailing spaces; gtfs.py _rows strips fieldnames+values.
url = "https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip"
country = "ES"
license = "Spanish public-sector reuse (attribution: Renfe)"
# route_allow: patterns matched via re.search against route_short_name (when
# set, else route_long_name). Anchored ^...$ because route_short_name is the
# full product word in this feed.
route_allow = ["^AVE$", "^AVE INT$", "^ALVIA$", "^AVLO$", "^Intercity$", "^EUROMED$", "^TRENCELTA$"]
# No uic_regex: 5-digit internal stop ids (e.g. 17000 = Madrid-Chamartín),
# not UIC codes. Falls back to proximity+name matching for cross-feed merges.

# Competitor feed check (2026-07-10): Ouigo España publishes GTFS via the
# Spanish National Access Point (nap.transportes.gob.es). iryo does not
# currently publish a public GTFS feed. No scraping or proprietary APIs
# were attempted. If feeds become fully available and integrated, add them
# as separate entries (same route_allow product filtering approach as renfe).

[feeds.pkp]
# mkuran.pl community GTFS for Polish trains (incorporates PKP PLK schedule).
# Single zip with multiple agencies (Polregio, PKP Intercity, KM, etc).
# Stop IDs are 5-digit PLK internal codes (not UIC codes).
# Products by route_short_name: EIC, EIP, IC, TLK (PKP Intercity), EC, EN (International), LEO, RJ.
url = "https://mkuran.pl/gtfs/polish_trains.zip"
country = "PL"
license = "CC BY 4.0 / PKP PLK public sector data (mkuran.pl)"
route_allow = ["^EIP$", "^EIC$", "^IC$", "^TLK$", "^LEO$", "^RJ$", "^EC$", "^EN$"]
